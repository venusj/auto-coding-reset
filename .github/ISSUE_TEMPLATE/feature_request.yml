name: ✨ 特性建议
description: 建议一个新功能或改进
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议！提交前请先搜索是否已有类似 Issue，避免重复。

  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你当前遇到的、现有功能无法满足的场景。
      placeholder: "我在 … 时，因为 … 所以很不方便"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望项目怎么做？越具体越好。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 你是否考虑过其他实现方式？为什么不选它们？
    validations:
      required: false

  - type: dropdown
    id: provider
    attributes:
      label: 涉及的厂商
      multiple: true
      options:
        - 智谱 GLM Coding Plan
        - MiniMax Token Plan
        - 通用 / 都涉及
    validations:
      required: false
