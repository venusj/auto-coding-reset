name: 🐛 Bug 报告
description: 报告一个可复现的问题，帮助我们改进
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你提交 Bug！提交前请：
        1. 先搜索是否已有相同 Issue；
        2. **绝对不要粘贴真实 API Key**，日志/配置中的 Key 请打码。

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 简述发生了什么、你期望的行为、实际的行为。
      placeholder: "我在做 … 时，期望 …，但实际 …"
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 一步步说明如何重现。
      placeholder: |
        1. 配置 …
        2. 运行 …
        3. 看到 …
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 相关配置（务必抹掉 API Key）
      description: 粘贴 config.yaml 的相关部分，**不要包含任何 Key**。
      render: yaml
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: 日志（务必抹掉敏感信息）
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: 版本 / 部署方式
      placeholder: "如 v0.1.0 + Docker，或本地 pip install -e .[dev]"
    validations:
      required: false

  - type: dropdown
    id: provider
    attributes:
      label: 涉及的厂商
      multiple: true
      options:
        - 智谱 GLM Coding Plan
        - MiniMax Token Plan
        - 通用 / 都涉及
    validations:
      required: false
