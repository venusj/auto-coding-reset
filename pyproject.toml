[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "auto-coding-reset"
version = "0.1.0"
description = "监控与调度 MiniMax / 智谱 编程套餐（Coding Plan）的 5 小时滚动窗口额度"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "venusj" },
]
keywords = ["llm", "coding-plan", "minimax", "zhipu", "glm", "quota", "monitor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "sqlmodel>=0.0.21",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "apprise>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx[cli]>=0.27",
]

[project.urls]
Homepage = "https://github.com/venusj/auto-coding-reset"
Repository = "https://github.com/venusj/auto-coding-reset"
Issues = "https://github.com/venusj/auto-coding-reset/issues"
Changelog = "https://github.com/venusj/auto-coding-reset/blob/main/CHANGELOG.md"

# ---- 工具配置 ----
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
